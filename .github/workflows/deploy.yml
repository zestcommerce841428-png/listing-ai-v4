name: Deploy to Production

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # ── Build Docker image ───────────────────────────────────────────────
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/listing-ai:production

      # ── Deploy via SSH ───────────────────────────────────────────────────
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/listing-ai
            docker-compose pull app
            docker-compose up -d --no-deps app
            docker-compose exec -T app npx prisma db push --accept-data-loss
            docker-compose exec -T app curl -s http://localhost:3000/api/health
            echo "✅ Deployment complete"

      # ── Health Check ─────────────────────────────────────────────────────
      - name: Verify deployment
        run: |
          sleep 15
          curl -f https://${{ secrets.DEPLOY_HOST }}/api/health || exit 1
          echo "✅ Health check passed"

      # ── Notify ───────────────────────────────────────────────────────────
      - name: Notify deployment
        if: always()
        run: |
          echo "Deployment ${{ job.status }} for commit ${{ github.sha }}"
